<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>

        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="Nome">Nome:</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">

            <label for="Sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" required placeholder="Digite seu sobrenome">

            <label for="Senha">Senha:</label>
            <input type="password" id="senha" required placeholder="Digite sua senha">

            <label for="Email">Email:</label>
            <input type="email" id="email" required placeholder="Digite seu @email">

            <label for="Idade">Idade:</label>
            <input type="number" id="idade" required placeholder="Digite sua idade" min="14" max="100">

            <label for="DataNascimento">Data de nascimento:</label>
            <input type="date" id="dataNascimento" required placeholder="dd/mm/aaaa">

        </fieldset>

        <fieldset>
            <legend>Trabalho</legend>
            <input required type="radio" id="CSS e HTML" name="Trabalho" value="CSS e HTML">
            <label for="CSS e HTML">CSS e HTML</label>

            <input required type="radio" id="JavaScript" name="Trabalho" value="JavaScript">
            <label for="JavaScript">JavaScript</label>

            <input required type="radio" id="Python" name="Trabalho" value="Python">
            <label for="Python">Python</label>

            <input required type="radio" id="Java" name="Trabalho" value="Java">
            <label for="Java">Java</label>

            <input required type="radio" id="Banco de dados" name="Trabalho" value="Banco de dados">
            <label for="Banco de dados">Banco de dados</label>

        </fieldset>

        <fieldset>
            <legend>Modalidade</legend>
            <input required type="radio" id="Presencial" name="Modalidade" value="Presencial">
            <label for="Presencial">Presencial</label>

            <input required type="radio" id="On-Line" name="Modalidade" value="On-Line">
            <label for="On-Line">On-Line</label>
        </fieldset>

        <fieldset>
            <legend>Turno</legend>
            <input required type="radio" id="Manha" name="Turno" value="Manha">
            <label for="Manha">Manha</label>

            <input required type="radio" id="Tarde" name="Turno" value="Tarde">
            <label for="Tarde">Tarde</label>

            <input required type="radio" id="Noite" name="Turno" value="Noite">
            <label for="Noite">Noite</label>
        </fieldset>

        <fieldset>
            <legend>Nível de Conhecimento</legend>
            <select id="Nivel de Conhecimento" name="Nivel">
                <option required value="">Selecione o seu nivel de Conhecimento</option>
                <option required value="Iniciante">Iniciante</option>
                <option required value="Intermediário">Intermediário</option>
                <option required value="Avançado">Avançado</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Tecnologias</legend>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">HTML</label>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">CSS</label>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">JavaScript</label>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">Python</label>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">Java</label>
            <input type="checkbox" id="Tecnologias" name="Tecnologias" value="Tecnologias">
            <label for="Tecnologias">C#</label>
        </fieldset>
        <fieldset>
            <legend>Estado</legend>
            <select id="Estado" name="Estado">
                <option value="">Selecione o seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="ES">Espírito Santo</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Diga sobre você</legend>
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40"
                placeholder="Conte-nos um pouco sobre você..."></textarea>
        </fieldset>

        <fieldset>
            <legend>Termos de uso</legend>
            <input type="checkbox" id="Termos" name="Termos" value="Termos" required>
            <label for="Termos">Aceito os termos de uso</label>
        </fieldset>

        <fieldset>
            <button type="submit">Cadastrar</button>
            <button type="reset">Limpar</button>
        </fieldset>
    </form>

</body>

</html>
